<!doctype html>
<meta charset="utf-8">
<title>Hexa contact sheet</title>
<style>
  html, body { margin: 0; background: #0b0f1c; overflow: hidden; }
  canvas { display: block; }
</style>
<canvas id="c"></canvas>
<script type="module">
  // Dev only: Hexa in her key poses, her visor glyphs and her core, to check how she looks.
  import { buildRig, solvePose } from '../js/character/rig.js';
  import { drawCharacter, drawCore, makeChains, anchorFor } from '../js/character/draw.js';
  import { drawGlyph, GLYPH_NAMES } from '../js/character/glyphs.js';
  import { Player, ACTS } from '../js/character/acting.js';

  const pack = await (await fetch('hexa://app/packs/hexa/pack.json')).json();
  const rig = buildRig(pack);
  const canvas = document.getElementById('c');
  const W = innerWidth; const H = innerHeight;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.font = '13px monospace';

  // [label, act, key drawing to show, emblem colour]
  const poses = [
    ['stand', 'stand', 0, '#3ef2ff'], ['work', 'work', 1, '#3ef2ff'], ['wave', 'wave', 1, '#3ef2ff'],
    ['zap', 'zap', 3, '#3ef2ff'], ['sit', 'sit', 6, '#3ef2ff'],
    ['sleep', 'sleep', 1, '#ffb43a'], ['alert', 'alert', 0, '#ff3ea5'], ['dragged', 'dragged', 0, '#ff3ea5'],
    ['exit 0', 'exit0', 3, '#4dff9a'], ['segfault', 'segfault', 2, '#ff4d4d'],
    ['peek', 'peek', 0, '#3ef2ff'], ['fall', 'fall', 0, '#ff3ea5'], ['land', 'land', 0, '#3ef2ff'],
    ['teleport', 'teleportOut', 1, '#3ef2ff'], ['spin', 'spin', 2, '#3ef2ff'],
  ];
  const frameOf = (name, key) => {
    const p = new Player();
    const act = ACTS[name];
    const ms = act.keys.slice(0, key).reduce((n, [hold]) => n + hold, 0) * (1000 / 12) + 1;
    if (act.loop) { p.stance(name); p.tick(ms); } else { p.stance('stand'); p.play(name); p.tick(ms); }
    return p.frame();
  };
  const cellW = W / 5;
  poses.forEach(([label, name, key, emblem], i) => {
    const col = i % 5; const row = Math.floor(i / 5);
    const x = cellW * col + cellW / 2; const y = 290 + row * 280;
    const pose = frameOf(name, key);
    const visor = pose.visor || 'calm';
    const at = { x, y, scale: 1, dir: 1 };
    const xf = solvePose(rig, pose, at);
    const chains = makeChains(rig);
    const lift = (pose.bristle || 0) * 1400;
    for (let k = 0; k < 120; k++) for (const def of rig.chains) chains.get(def.id).step(anchorFor(rig, xf, def), 1 / 60, 0, def.id === 'cable' ? 0 : lift);
    drawCharacter(ctx, rig, xf, chains, pose, { visor, emblem, link: i % 2, boil: i });
    ctx.fillStyle = '#8a95b8';
    ctx.fillText(label, x - ctx.measureText(label).width / 2, y + 40);
  });

  // her core, in the last cell
  drawCore(ctx, W - 70, 70, 64, { visor: pack.glyphs.sleepy, emblem: '#3ef2ff', palette: pack.palette });
  ctx.fillStyle = '#8a95b8';
  ctx.fillText('core', W - 84, 130);

  // the twelve visor glyphs, big
  GLYPH_NAMES.forEach((name, i) => {
    const x = 40 + (i % 12) * ((W - 80) / 12);
    const y = H - 110;
    ctx.fillStyle = pack.palette.visor;
    ctx.fillRect(x, y, 110, 46);
    drawGlyph(ctx, pack.glyphs[name], [x + 6, y + 6, 98, 34], pack.palette.amber);
    ctx.fillStyle = '#8a95b8';
    ctx.fillText(name, x, y + 66);
  });

  document.title = 'ready';
</script>
