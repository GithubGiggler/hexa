name: Release

# A tag like v0.1.0 builds every Linux package and attaches them to the GitHub Release for that tag.
# Run it by hand (Actions > Release > Run workflow) to build the packages without releasing:
# they're kept as a workflow artifact instead.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # rpmbuild for the rpm, bsdtar and zstd for the pacman package. fpm itself comes with electron-builder.
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools zstd

      - run: npm ci
      - run: npm test

      # electron-builder releases to v<package.json version>, so a tag that doesn't match it
      # would quietly publish somewhere else.
      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Build and publish
        if: github.ref_type == 'tag'
        run: npx electron-builder --linux --publish always -c.publish.provider=github -c.publish.releaseType=release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only
        if: github.ref_type != 'tag'
        run: npx electron-builder --linux --publish never

      - name: Keep the packages
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: hexa-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.tar.gz
          if-no-files-found: error
